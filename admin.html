<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Quản trị — Xe Điện Đức Tú</title><link rel="stylesheet" href="style.css"><script src="admin.js" defer></script></head><body><header><a class="logo" href="/">ĐỨC TÚ ●</a><span>Quản trị cửa hàng</span><button id="logout" hidden>Đăng xuất</button></header><main class="admin-wrap"><p id="admin-status" role="status"></p><form id="login" class="admin-panel"><h2>Đăng nhập quản trị</h2><label>Mật khẩu quản trị<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Đăng nhập</button></form><div id="dashboard" hidden><section class="admin-panel"><h2>Thông tin cửa hàng</h2><p>Điền số điện thoại, địa chỉ và tên pháp lý để bật nhận đơn. Xác nhận chính sách trước khi công bố.</p><form id="settings-form"><div id="settings-fields" class="admin-fields"></div><button class="primary">Lưu thông tin</button></form></section><section class="admin-panel"><h2>Sản phẩm</h2><p>Các mẫu có sẵn chưa được công bố vì giá và thông số chưa được xác nhận. Hình xe là minh họa.</p><form id="product-form"><input name="id" type="hidden"><input name="image" type="hidden"><label>Ảnh xe thật (PNG/JPEG/WebP, tối đa 2 MB)<input id="product-photo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="admin-fields"><label>Hãng<input name="brand" required maxlength="60"></label><label>Tên xe<input name="name" required maxlength="100"></label><label>Giá (VND)<input name="price" type="number" min="1" max="1000000000" required></label><label>Quãng đường (km)<input name="range" type="number" min="0" max="1000" required></label><label>Tốc độ (km/h)<input name="speed" type="number" min="0" max="300" required></label><label>Màu minh họa (0–360)<input name="hue" type="number" min="0" max="360" value="0" required></label><label>Nhãn<input name="badge" maxlength="60"></label><label>Công bố sản phẩm<input name="published" type="checkbox"></label></div><div class="admin-actions"><button class="primary">Lưu sản phẩm</button><button type="button" id="new-product">Tạo sản phẩm mới</button></div></form><div id="admin-products"></div></section><section class="admin-panel"><h2>Đơn đặt xe</h2><button id="refresh">Làm mới dữ liệu</button><div id="admin-orders"></div></section><section class="admin-panel"><h2>Yêu cầu tư vấn</h2><div id="admin-consultations"></div></section></div></main></body></html>
