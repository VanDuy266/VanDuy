<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Thu / hoàn tiền — Quản trị Đức Tú</title><link rel="stylesheet" href="/style.css?v=2.1.0"><link rel="stylesheet" href="/brand.css?v=2.1.0"><link rel="stylesheet" href="/v2.css?v=2.1.0"><link rel="icon" href="/assets/duc-tu-logo.png"><script src="/admin.js?v=2.1.0" defer></script></head><body data-admin-page="thanh-toan"><header><a class="logo" href="/"><img class="admin-brand-logo" src="/assets/duc-tu-logo.png" alt="Đức Tú"> ĐỨC TÚ</a><span>Thu / hoàn tiền</span><button id="logout" hidden>Đăng xuất</button></header><main class="admin-wrap"><p id="admin-status" role="status"></p><form id="login" class="admin-panel"><h2>Đăng nhập quản trị</h2><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Đăng nhập</button></form><div id="dashboard" hidden><nav class="admin-navigation"><a href="/admin" >Tổng quan</a><a href="/admin/san-pham" >Sản phẩm</a><a href="/admin/don-hang" >Đơn hàng</a><a href="/admin/tu-van" >Tư vấn</a><a href="/admin/cai-dat" >Cài đặt</a><a href="/admin/thanh-toan" aria-current="page">Thu / hoàn tiền</a></nav><section class="admin-panel"><h2>Ghi nhận thu / hoàn tiền</h2><p>Đây là ghi nhận của nhân viên dựa trên chứng từ, không phải xác nhận tự động từ cổng thanh toán. Chỉ nhập sau khi đã kiểm tra khoản tiền thực tế.</p><form id="payment-form"><label>Mã đơn<select name="orderId" id="payment-order" required></select></label><label>Loại ghi nhận<select name="kind"><option value="receipt">Khoản thu đã kiểm tra</option><option value="refund">Khoản hoàn đã thực hiện</option></select></label><label>Số tiền (VND)<input name="amount" type="number" min="1" max="1000000000" step="1" required></label><label>Số chứng từ / mã giao dịch<input name="reference" required minlength="3" maxlength="120"></label><label>Ghi chú<textarea name="note" maxlength="1000"></textarea></label><button class="primary">Lưu ghi nhận</button></form><div id="payment-records"></div></section></div></main></body></html>
