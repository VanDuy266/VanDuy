<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sản phẩm — Quản trị Đức Tú</title><link rel="stylesheet" href="/style.css?v=2.1.0"><link rel="stylesheet" href="/brand.css?v=2.1.0"><link rel="stylesheet" href="/v2.css?v=2.1.0"><link rel="icon" href="/assets/duc-tu-logo.png"><script src="/admin.js?v=2.1.0" defer></script></head><body data-admin-page="san-pham"><header><a class="logo" href="/"><img class="admin-brand-logo" src="/assets/duc-tu-logo.png" alt="Đức Tú"> ĐỨC TÚ</a><span>Sản phẩm</span><button id="logout" hidden>Đăng xuất</button></header><main class="admin-wrap"><p id="admin-status" role="status"></p><form id="login" class="admin-panel"><h2>Đăng nhập quản trị</h2><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Đăng nhập</button></form><div id="dashboard" hidden><nav class="admin-navigation"><a href="/admin" >Tổng quan</a><a href="/admin/san-pham" aria-current="page">Sản phẩm</a><a href="/admin/don-hang" >Đơn hàng</a><a href="/admin/tu-van" >Tư vấn</a><a href="/admin/cai-dat" >Cài đặt</a><a href="/admin/thanh-toan" >Thu / hoàn tiền</a></nav><section class="admin-panel"><h2>Sản phẩm</h2><p>Danh mục Yadea dùng giá đề xuất 13, 16 và 17 triệu. Xác nhận lại tên phiên bản và thông số trước khi bán. Tồn kho trống nghĩa là cần xác nhận; nhập 0 để báo hết hàng.</p><form id="product-form"><input name="id" type="hidden"><input name="image" type="hidden"><input name="gallery" type="hidden" value="[]"><label>Nguồn ảnh (URL HTTPS của bài đăng hoặc sản phẩm)<input name="image_source" type="url" maxlength="1000"></label><label>Bộ ảnh thêm (tối đa 8 ảnh, mỗi ảnh ≤2 MB)<input id="gallery-photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="gallery-preview"></div><label>Ảnh xe thật (PNG/JPEG/WebP, tối đa 2 MB)<input id="product-photo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="admin-fields"><label>Hãng<input name="brand" required maxlength="60"></label><label>Tên xe<input name="name" required maxlength="100"></label><label>Giá (VND)<input name="price" type="number" min="1" max="1000000000" required></label><label>Quãng đường (km)<input name="range" type="number" min="0" max="1000" required></label><label>Tốc độ (km/h)<input name="speed" type="number" min="0" max="300" required></label><label>Màu minh họa (0–360)<input name="hue" type="number" min="0" max="360" value="0" required></label><label>Nhãn<input name="badge" maxlength="60"></label><label>Kiểu xe<select name="category"><option value="city">Thanh lịch</option><option value="sport">Thể thao</option><option value="compact">Nhỏ gọn</option></select></label><label>Tồn kho (để trống nếu cần xác nhận)<input name="stock" type="number" min="0" max="10000"></label><label>Ghi chú giá<input name="price_note" maxlength="300"></label><label>Mô tả xe<textarea name="description" maxlength="3000"></textarea></label><label>Thông số chi tiết (mỗi dòng Tên: Giá trị)<textarea name="specifications" maxlength="10000" placeholder="Ắc quy: Graphene 48V22Ah"></textarea></label><label>Công bố sản phẩm<input name="published" type="checkbox"></label></div><div class="admin-actions"><button class="primary">Lưu sản phẩm</button><button type="button" id="new-product">Tạo sản phẩm mới</button></div></form><div id="admin-products"></div></section></div></main></body></html>
